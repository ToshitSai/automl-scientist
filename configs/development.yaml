# AutoML Scientist Development Configuration
system:
  name: "AutoML Scientist (Dev)"
  environment: "development"
  debug: true

llm:
  default_provider: "openai"
  default_model: "gpt-4o"
  fallback_model: "gpt-4o-mini"
  temperature: 0.7
  max_tokens: 4096

research:
  max_experiments: 10
  compute_budget_minutes: 60
  num_workers: 2
  max_debug_depth: 3
  statistical_confidence_level: 0.95

sandbox:
  docker_enabled: true
  docker_image: "python:3.11-slim"
  cpu_limit: "2.0"
  memory_limit: "4g"
  timeout_seconds: 300
  network_access: false

database:
  pool_size: 5
  max_overflow: 10

logging:
  level: "DEBUG"
